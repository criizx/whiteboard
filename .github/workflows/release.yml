name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: whiteboard-linux-x64
          - name: macOS arm64
            os: macos-14
            artifact: whiteboard-macos-arm64
          - name: Windows x64
            os: windows-2025
            artifact: whiteboard-windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.4"
          modules: qtwebsockets
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ninja-build

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install openssl@3 ninja

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install openssl:x64-windows

      - name: Configure Unix
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          cmake -S frontend -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWHITEBOARD_ENABLE_P2P=ON
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist"

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S frontend -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWHITEBOARD_ENABLE_P2P=ON
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release --component Whiteboard

      - name: Sign macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          find dist/whiteboard.app/Contents -type f \( -name '*.dylib' -o -name '*.so' \) -exec codesign --force --sign - {} \;
          find dist/whiteboard.app/Contents/Frameworks -type d -name '*.framework' -exec codesign --force --deep --sign - {} \;
          codesign --force --sign - dist/whiteboard.app/Contents/MacOS/whiteboard
          codesign --force --sign - dist/whiteboard.app

      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 dist/whiteboard.app

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "${{ matrix.artifact }}.tar.gz" -C dist .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --verify-tag --generate-notes
